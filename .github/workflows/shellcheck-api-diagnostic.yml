name: ShellCheck API diagnostic

on:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize bounded evidence directory
        run: |
          mkdir -p tools/shellcheck-api-poc/_run/results
          echo 'Diagnostic only: tests/test_endpoint_display.sh nonempty follow-up; incomplete until both measurements and comparison succeed.' > tools/shellcheck-api-poc/_run/results/scope.txt
      - name: Set up exact compiler and solver
        uses: haskell-actions/setup@96f3dafd067155f32643c2a0757ab71d2910e2c2 # v2.8.0
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
          cabal-update: false # explicit bounded `cabal update` in resolve step owns the index
      - name: Resolve and archive the per-run lock before compilation
        timeout-minutes: 8
        run: bash tools/shellcheck-api-poc/run.sh resolve
      - name: Compile separately with one build worker
        timeout-minutes: 16
        run: bash tools/shellcheck-api-poc/run.sh build
      - name: Measure the CLI and then the already-built API executable
        timeout-minutes: 8
        run: bash tools/shellcheck-api-poc/run.sh measure
      - name: Cap retained logs
        if: always()
        run: |
          # Fixed file list, no build tree/binaries, at most 8 MiB per artifact file.
          find tools/shellcheck-api-poc/_run/results -type f -size +8388608c -print -exec truncate -s 8388608 {} \;
      - name: Summarize diagnostic scope
        if: always()
        run: |
          echo 'Diagnostic only: one-file nonempty follow-up (tests/test_endpoint_display.sh), not full lint or a coverage workaround.' >> "$GITHUB_STEP_SUMMARY"
          if test -f tools/shellcheck-api-poc/_run/results/comparison.txt; then
            cat tools/shellcheck-api-poc/_run/results/comparison.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Incomplete: inspect bounded artifacts; no parity claim.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain bounded evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shellcheck-api-diagnostic
          path: tools/shellcheck-api-poc/_run/results/
          if-no-files-found: warn
          retention-days: 7
