name: ShellCheck per-file diagnostic

on:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/shellcheck-per-file-diagnostic"
          echo 'Diagnostic only: one full-manifest per-file measurement, not full parity or adoption.' > "$RUNNER_TEMP/shellcheck-per-file-diagnostic/scope.txt"
      - name: Provision exact pinned ShellCheck
        timeout-minutes: 3
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bin=$(sh scripts/install-shellcheck.sh)
          echo "SC_BIN_DIR=$bin" >> "$GITHUB_ENV"
      - name: Run focused candidate selftests
        timeout-minutes: 5
        run: |
          SHELLCHECK="$SC_BIN_DIR/shellcheck" python3 tools/shellcheck-per-file-poc/test_candidate.py > "$RUNNER_TEMP/shellcheck-per-file-diagnostic/selftests.log" 2>&1
      - name: Measure the full manifest once
        id: measurement
        timeout-minutes: 30
        run: |
          # Guard stays OFF here. No first-group/cgroup trial is authorized by this workflow.
          set +e
          python3 tools/shellcheck-per-file-poc/run_manifest.py \
            --shellcheck "$SC_BIN_DIR/shellcheck" --progress \
            --report "$RUNNER_TEMP/shellcheck-per-file-diagnostic/manifest.jsonl" \
            2>/dev/null | tee "$RUNNER_TEMP/shellcheck-per-file-diagnostic/measurement.log" 2>/dev/null
          statuses=("${PIPESTATUS[@]}")
          set -e
          status=${statuses[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/shellcheck-per-file-diagnostic/exit-status.txt"
          # Keep Python's lint/failure status; a logging failure must also fail.
          # tee errors are silenced above because they may disclose runner paths.
          if (( statuses[1] != 0 )); then
            exit 2
          fi
          exit "$status"
      - name: Summarize without raw transcript
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
        id: summarize
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, 'tools/shellcheck-per-file-poc')
          root = Path(os.environ['RUNNER_TEMP']) / 'shellcheck-per-file-diagnostic'
          root.mkdir(exist_ok=True)
          text = 'Diagnostic only: one full-manifest per-file measurement; no full-parity or adoption claim.\n\n'
          complete = False
          count = diagnostics = 0
          try:
              from candidate import (production_manifest, progress_record, relative_target, COUNTERS,
                                     SAMPLE_BYTES, SAMPLE_COUNT, SAMPLE_INTERVAL)

              def guard_complete(measurement, index):
                  guard = measurement.get('guard')
                  if guard is None:
                      return True
                  if (guard['cleanup'] != {'quiescent': True, 'removed': True}
                          or guard['sample_interval_s'] != SAMPLE_INTERVAL
                          or guard['sample_count_cap'] != SAMPLE_COUNT
                          or guard['sample_byte_cap'] != SAMPLE_BYTES
                          or measurement.get('terminated_by_signal') is not None
                          or not 2 <= len(guard['samples']) <= SAMPLE_COUNT):
                      return False
                  limits = guard['limits']
                  if any(type(limits[k]) is not int or not 0 < limits[k] < 2**63
                         for k in ('memory_bytes', 'cpu_usec', 'cpu_quota_usec', 'cpu_period_usec')):
                      return False
                  size = 0
                  for number, sample in enumerate(guard['samples']):
                      size += len(progress_record(sample).encode('ascii')) * (1 if index == -1 else 3)
                      if (sample['index'] != index or sample['sample'] != number
                              or any(sample[k] == 'unavailable' for k in COUNTERS)
                              or sample['memory_current'] >= limits['memory_bytes']
                              or sample['memory_peak'] >= limits['memory_bytes']
                              or sample['cpu_usage_usec'] >= limits['cpu_usec']
                              or sample['oom'] or sample['oom_kill']):
                          return False
                  return size <= SAMPLE_BYTES

              header = version = summary = None
              errors = False
              active = None
              samples = []
              sample_bytes = 0
              with (root / 'manifest.jsonl').open() as stream:
                  for line in stream:
                      if not line.endswith('\n'):
                          raise ValueError('partial record')
                      row = json.loads(line)
                      kind = row['type']
                      if summary is not None:
                          raise ValueError('records after summary')
                      if header is None:
                          if kind != 'header' or row['schema'] != 1:
                              raise ValueError('missing header')
                          header = row
                          if row['arguments'] != production_manifest() or not row['manifest']:
                              raise ValueError('wrong manifest')
                          if len(row['manifest']) != len(row['arguments']):
                              raise ValueError('wrong occurrence count')
                      elif version is None:
                          if kind != 'version':
                              raise ValueError('missing version')
                          version = row
                          errors = (bool(row['errors']) or row['version'] is None
                                    or bool(row['version']['errors'])
                                    or not guard_complete(row['version'], -1))
                      elif kind == 'target_start':
                          if active is not None or row['index'] != count:
                              raise ValueError('wrong start order')
                          if (set(row) != {'type', 'index', 'target', 'group_count'}
                                  or row['target'] != relative_target(header['manifest'][count])
                                  or row['target'].startswith('/') or not 1 <= row['group_count'] <= len(header['manifest'])):
                              raise ValueError('invalid start')
                          progress_record(row)  # Validate allowlist scalar types and 1 KiB bound.
                          active = row
                          samples = []
                          sample_bytes = 0
                      elif kind == 'resource_sample':
                          if active is None or row['index'] != count or row['sample'] != len(samples):
                              raise ValueError('wrong sample order')
                          safe = json.loads(progress_record(row))
                          if set(row) != set(safe) - {'schema'}:
                              raise ValueError('unexpected sample fields')
                          sample_bytes += 3 * len(progress_record(row).encode('ascii'))
                          if len(samples) >= SAMPLE_COUNT or sample_bytes > SAMPLE_BYTES:
                              raise ValueError('sample cap exceeded')
                          samples.append(row)
                      elif kind == 'target':
                          if row['index'] != count or row['target'] != header['manifest'][count]:
                              raise ValueError('wrong target order')
                          if active is None or active['group_count'] != len(row['group']):
                              raise ValueError('missing/inconsistent start')
                          measurement = row['measurement'] or {}
                          guard = measurement.get('guard')
                          if guard is not None:
                              if (guard['samples'] != samples or guard['cleanup'] != {'quiescent': True, 'removed': True}):
                                  errors = True
                          elif samples:
                              raise ValueError('samples without guard')
                          active = None
                          errors |= (bool(row['errors']) or row['status'] not in (0, 1)
                                     or bool(measurement.get('errors'))
                                     or not guard_complete(measurement, count))
                          diagnostics += len(row['target_diagnostics'])
                          count += 1
                      elif kind == 'summary':
                          if active is not None:
                              raise ValueError('unfinished target')
                          summary = row
                      else:
                          raise ValueError('unexpected record')
              status = int((root / 'exit-status.txt').read_text())
              complete = (header is not None and version is not None and summary is not None
                          and count == len(header['manifest']) and not errors
                          and not summary['errors'] and summary['complete'] is True
                          and summary['status'] == status == int(bool(diagnostics))
                          and os.environ['MEASUREMENT_OUTCOME'] == ('success' if status == 0 else 'failure'))
          except (OSError, ValueError, KeyError, TypeError, IndexError, ImportError):
              complete = False
          if complete:
              text += f'Complete measurement: {count} target occurrences, {diagnostics} target diagnostics, exit status {status}.\n'
          else:
              text += 'Incomplete: missing, partial, inconsistent, or failed evidence/process completion; never a lint pass. Inspect retained artifacts.\n'
          (root / 'summary.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(text)
          sys.exit(0 if complete else 1)
          PY
      - name: Retain untruncated evidence even on failure or incomplete measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shellcheck-per-file-diagnostic
          path: ${{ runner.temp }}/shellcheck-per-file-diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary pinned binary directory after upload
        if: always()
        run: |
          if test -n "${SC_BIN_DIR:-}"; then
            rm -rf -- "$SC_BIN_DIR"
          fi
