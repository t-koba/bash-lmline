name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the full suite or the bounded ShellCheck API diagnostic only
        type: choice
        required: true
        default: full
        options:
          - full
          - shellcheck-api-diagnostic

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu runs the full suite and the sole full pinned ShellCheck lint;
        # macOS runs the pinned Darwin provisioning smoke plus the non-lint suite
        # for native OS/terminal/shell differences. Together both jobs retain full
        # coverage, and base-branch runs remain the flake catch.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-subject check reads the history to find the commit
          # that added it, so the whole history is needed.
          fetch-depth: 0
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zsh expect xz-utils
      - name: Install dependencies (macOS)
        # macOS ships bash 3.2; the tests need bash 4.2+ first on PATH.
        run: brew install bash jq
        if: runner.os == 'macOS'
      - name: Run tests (Ubuntu)
        id: run_tests_ubuntu
        if: runner.os == 'Linux'
        run: LMLINE_REQUIRE_SHELLCHECK=1 bash tests/run.sh
      - name: Retain ShellCheck resource diagnostics
        if: ${{ always() && runner.os == 'Linux' && steps.run_tests_ubuntu.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-resource-diagnostics
          path: ${{ runner.temp }}/lmline-shellcheck-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Provision pinned ShellCheck (macOS smoke)
        if: runner.os == 'macOS'
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash tests/test_shellcheck.sh --provision-only
      - name: Run tests (macOS)
        id: run_tests_macos
        if: runner.os == 'macOS'
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash tests/run.sh --skip-shellcheck
      - name: Retry PTY test after a macOS suite failure for diagnostics
        if: ${{ always() && steps.run_tests_macos.outcome == 'failure' && runner.os == 'macOS' }}
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          status=0
          for attempt in 1 2 3; do
            echo "PTY diagnostic attempt ${attempt}/3"
            bash tests/test_pty.sh || status=$?
          done
          exit "$status"

  shellcheck_api_diagnostic:
    name: ShellCheck API diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'shellcheck-api-diagnostic' }}
    permissions:
      contents: read
    uses: ./.github/workflows/shellcheck-api-diagnostic.yml
