name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zsh expect xz-utils
      - name: Install dependencies (macOS)
        # macOS ships bash 3.2; the tests need bash 4.2+ first on PATH.
        run: brew install bash jq
        if: runner.os == 'macOS'
      - name: Install pinned ShellCheck
        run: sh scripts/install-shellcheck.sh
      - name: Run tests
        id: run_tests
        env:
          LMLINE_REQUIRE_SHELLCHECK: "1"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          : "${SHELLCHECK_BIN_DIR:?pinned ShellCheck was not installed}"
          export PATH="$SHELLCHECK_BIN_DIR:$PATH"
          bash tests/run.sh
      - name: Retry PTY test after a macOS suite failure for diagnostics
        if: ${{ always() && steps.run_tests.outcome == 'failure' && runner.os == 'macOS' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          status=0
          for attempt in 1 2 3; do
            echo "PTY diagnostic attempt ${attempt}/3"
            bash tests/test_pty.sh || status=$?
          done
          exit "$status"
