name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both runners execute the full suite: real PTY/Readline behavior, shell/system-tool
        # differences, and platform-specific ShellCheck assets differ per OS, and the
        # main-branch run after promotion catches flakes.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zsh expect xz-utils
      - name: Install dependencies (macOS)
        # macOS ships bash 3.2; the tests need bash 4.2+ first on PATH.
        run: brew install bash jq
        if: runner.os == 'macOS'
      - name: Run tests
        id: run_tests
        env:
          LMLINE_REQUIRE_SHELLCHECK: "1"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          bash tests/run.sh
      - name: Retry PTY test after a macOS suite failure for diagnostics
        if: ${{ always() && steps.run_tests.outcome == 'failure' && runner.os == 'macOS' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          status=0
          for attempt in 1 2 3; do
            echo "PTY diagnostic attempt ${attempt}/3"
            bash tests/test_pty.sh || status=$?
          done
          exit "$status"
