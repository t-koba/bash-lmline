name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the full suite or a ShellCheck diagnostic only
        type: choice
        required: true
        default: full
        options:
          - full
          - shellcheck-api-diagnostic
          - shellcheck-per-file-diagnostic

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms run the full test suite. macOS owns the full pinned
        # ShellCheck lint because Ubuntu's release-asset download has been
        # intermittently unavailable; Ubuntu skips only that lint while retaining
        # its bounded monitor regression. Both jobs keep native OS coverage.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The commit-subject check reads the history to find the commit
          # that added it, so the whole history is needed.
          fetch-depth: 0
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zsh expect xz-utils ripgrep
      - name: Install dependencies (macOS)
        # macOS ships bash 3.2; the tests need bash 4.2+ first on PATH.
        # A transient registry/DNS failure must not fail the job before tests.
        run: |
          for attempt in 1 2 3; do
            if brew install bash jq ripgrep; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 10))
            fi
          done
          exit 1
        if: runner.os == 'macOS'
      - name: Run tests (Ubuntu)
        id: run_tests_ubuntu
        if: runner.os == 'Linux'
        run: bash tests/run.sh --skip-shellcheck
      - name: Run tests (macOS)
        id: run_tests_macos
        if: runner.os == 'macOS'
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          LMLINE_REQUIRE_SHELLCHECK=1 bash tests/run.sh
      - name: Retain ShellCheck diagnostics
        if: ${{ always() && runner.os == 'macOS' && steps.run_tests_macos.outcome != 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shellcheck-per-file-evidence
          path: |
            ${{ runner.temp }}/lmline-shellcheck-per-file.*/manifest.jsonl
            ${{ runner.temp }}/lmline-shellcheck-per-file.*/measurement.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retry PTY test after a macOS suite failure for diagnostics
        if: ${{ always() && steps.run_tests_macos.outcome == 'failure' && runner.os == 'macOS' }}
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          status=0
          for attempt in 1 2 3; do
            echo "PTY diagnostic attempt ${attempt}/3"
            bash tests/test_pty.sh || status=$?
          done
          exit "$status"

  shellcheck_api_diagnostic:
    name: ShellCheck API diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'shellcheck-api-diagnostic' }}
    permissions:
      contents: read
    uses: ./.github/workflows/shellcheck-api-diagnostic.yml

  shellcheck_per_file_diagnostic:
    name: ShellCheck per-file diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'shellcheck-per-file-diagnostic' }}
    permissions:
      contents: read
    uses: ./.github/workflows/shellcheck-per-file-diagnostic.yml
